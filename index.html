<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YTDL — Video Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --accent: #e8ff47;
      --accent2: #ff4747;
      --text: #f0f0f0;
      --muted: #555;
      --mono: 'Space Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 40px;
      overflow-x: hidden;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .container {
      width: 100%;
      max-width: 640px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      margin-bottom: 52px;
    }

    .logo-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo {
      font-family: var(--sans);
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      color: var(--text);
    }

    .logo span {
      color: var(--accent);
    }

    .tagline {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(to right, var(--accent), transparent);
      margin: 20px 0 28px;
    }

    /* URL input area */
    .input-section {
      margin-bottom: 20px;
    }

    .input-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    .url-row {
      display: flex;
      gap: 0;
    }

    .url-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-right: none;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s;
      border-radius: 0;
      -webkit-appearance: none;
    }

    .url-input::placeholder { color: var(--muted); }
    .url-input:focus { border-color: var(--accent); }

    .fetch-btn {
      background: var(--accent);
      color: #000;
      border: none;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 14px 20px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .fetch-btn:hover { background: #f4ff70; }
    .fetch-btn:active { transform: scale(0.97); }
    .fetch-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

    /* Quality selector */
    .quality-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .quality-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      margin-right: 4px;
    }

    .quality-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .quality-btn:hover { border-color: var(--accent); color: var(--text); }
    .quality-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(232,255,71,0.07); }

    /* Video preview card */
    #preview-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px;
      margin-bottom: 20px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .preview-inner {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .thumb {
      width: 120px;
      height: 68px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .preview-meta { flex: 1; min-width: 0; }

    .video-title {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .video-sub span { color: var(--accent); margin-right: 12px; }

    /* Download button */
    .download-btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
      display: none;
      position: relative;
      overflow: hidden;
    }

    .download-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.2s;
      z-index: 0;
    }

    .download-btn:hover::before { transform: scaleX(1); }
    .download-btn:hover { color: #000; }
    .download-btn span { position: relative; z-index: 1; }
    .download-btn:disabled { border-color: var(--border); color: var(--muted); cursor: not-allowed; }
    .download-btn:disabled::before { display: none; }

    /* Progress area */
    #progress-area {
      display: none;
      margin-bottom: 20px;
      animation: slideIn 0.3s ease;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-status {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .progress-stats {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .progress-track {
      height: 3px;
      background: var(--border);
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s ease;
      width: 0%;
    }

    .progress-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      to { left: 150%; }
    }

    .progress-percent {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      text-align: right;
    }

    /* Status / error messages */
    #status-msg {
      font-family: var(--mono);
      font-size: 12px;
      padding: 12px 14px;
      border-left: 2px solid var(--accent);
      background: rgba(232,255,71,0.04);
      display: none;
      animation: slideIn 0.3s ease;
    }

    #status-msg.error {
      border-color: var(--accent2);
      background: rgba(255,71,71,0.06);
      color: var(--accent2);
    }

    #status-msg.success {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Footer */
    footer {
      margin-top: auto;
      padding-top: 40px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
      text-align: center;
    }

    /* Spinner for fetch */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid #000;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    /* Pulse for indeterminate */
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .pulsing { animation: pulse 1.4s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-row">
        <div class="logo">YT<span>DL</span></div>
      </div>
      <div class="tagline">YouTube → MP4 Downloader</div>
      <div class="divider"></div>
    </header>

    <div class="input-section">
      <label class="input-label" for="url-input">Paste YouTube URL</label>
      <div class="url-row">
        <input
          id="url-input"
          class="url-input"
          type="text"
          placeholder="https://youtube.com/watch?v=..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="fetch-btn" class="fetch-btn">Fetch</button>
      </div>

      <div class="quality-row">
        <span class="quality-label">Quality:</span>
        <button class="quality-btn active" data-q="best">Best</button>
        <button class="quality-btn" data-q="1080p">1080p</button>
        <button class="quality-btn" data-q="720p">720p</button>
        <button class="quality-btn" data-q="480p">480p</button>
      </div>
    </div>

    <div id="preview-card">
      <div class="preview-inner">
        <img id="thumb" class="thumb" src="" alt="thumbnail" />
        <div class="preview-meta">
          <div id="video-title" class="video-title"></div>
          <div class="video-sub">
            <span id="video-duration"></span>
            <span id="video-uploader" style="color: var(--muted)"></span>
          </div>
        </div>
      </div>
    </div>

    <button id="download-btn" class="download-btn">
      <span>⬇ Download MP4</span>
    </button>

    <div id="progress-area">
      <div class="progress-header">
        <span id="progress-status" class="progress-status pulsing">DOWNLOADING</span>
        <span id="progress-stats" class="progress-stats"></span>
      </div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
        <div class="progress-shimmer"></div>
      </div>
      <div id="progress-percent" class="progress-percent">0%</div>
    </div>

    <div id="status-msg"></div>

    <footer>For personal use only · Respect copyright &amp; YouTube ToS</footer>
  </div>

  <script>
    const urlInput = document.getElementById('url-input');
    const fetchBtn = document.getElementById('fetch-btn');
    const previewCard = document.getElementById('preview-card');
    const downloadBtn = document.getElementById('download-btn');
    const progressArea = document.getElementById('progress-area');
    const statusMsg = document.getElementById('status-msg');

    let selectedQuality = 'best';
    let currentUrl = '';

    // Quality selector
    document.querySelectorAll('.quality-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedQuality = btn.dataset.q;
      });
    });

    function showStatus(msg, type = 'info') {
      statusMsg.textContent = msg;
      statusMsg.className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
      statusMsg.style.display = 'block';
    }

    function hideStatus() {
      statusMsg.style.display = 'none';
    }

    function setProgress(percent, stats) {
      document.getElementById('progress-fill').style.width = percent + '%';
      document.getElementById('progress-percent').textContent = percent.toFixed(1) + '%';
      if (stats) document.getElementById('progress-stats').textContent = stats;
    }

    // Fetch video info
    fetchBtn.addEventListener('click', fetchInfo);
    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') fetchInfo(); });

    async function fetchInfo() {
      const url = urlInput.value.trim();
      if (!url) return;

      fetchBtn.disabled = true;
      fetchBtn.innerHTML = '<span class="spinner"></span>Fetching';
      previewCard.style.display = 'none';
      downloadBtn.style.display = 'none';
      hideStatus();

      try {
        const res = await fetch('/api/info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (!res.ok) {
          showStatus(data.error || 'Failed to fetch video info', 'error');
          return;
        }

        document.getElementById('thumb').src = data.thumbnail;
        document.getElementById('video-title').textContent = data.title;
        document.getElementById('video-duration').textContent = data.duration;
        document.getElementById('video-uploader').textContent = data.uploader;

        currentUrl = url;
        previewCard.style.display = 'block';
        downloadBtn.style.display = 'block';
      } catch (e) {
        showStatus('Network error — is the server running?', 'error');
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.textContent = 'Fetch';
      }
    }

    // Download
    downloadBtn.addEventListener('click', startDownload);

    function startDownload() {
      if (!currentUrl) return;

      downloadBtn.disabled = true;
      progressArea.style.display = 'block';
      document.getElementById('progress-status').textContent = 'DOWNLOADING';
      hideStatus();
      setProgress(0, '');

      const encodedUrl = encodeURIComponent(currentUrl);
      const evtSource = new EventSource(`/api/download?url=${encodedUrl}&quality=${selectedQuality}`);

      evtSource.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === 'progress') {
          setProgress(msg.percent, `${msg.size} · ${msg.speed}`);
        } else if (msg.type === 'done') {
          evtSource.close();
          setProgress(100, '');
          document.getElementById('progress-status').textContent = 'COMPLETE';
          document.getElementById('progress-status').classList.remove('pulsing');

          // Trigger file download
          const link = document.createElement('a');
          link.href = `/api/file/${msg.token}`;
          link.click();

          showStatus('Download ready! Your file should start saving.', 'success');
          downloadBtn.disabled = false;

          setTimeout(() => {
            progressArea.style.display = 'none';
            document.getElementById('progress-status').classList.add('pulsing');
          }, 3000);
        } else if (msg.type === 'error') {
          evtSource.close();
          progressArea.style.display = 'none';
          showStatus(msg.message || 'Download failed', 'error');
          downloadBtn.disabled = false;
        }
      };

      evtSource.onerror = () => {
        evtSource.close();
        progressArea.style.display = 'none';
        showStatus('Connection lost during download.', 'error');
        downloadBtn.disabled = false;
      };
    }
  </script>
</body>
</html>
